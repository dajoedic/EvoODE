include:
  - component: $CI_SERVER_FQDN/devops_examples/components/security/trivy-fs@v3.2.0
    inputs:
      stage: security
      job-name: trivy-fs
      scan-path: .
      severity: HIGH,CRITICAL
      allow-failure: true
      tags:
        - cpu
  - component: $CI_SERVER_FQDN/devops_examples/components/security/trivy-image@v3.2.0
    inputs:
      stage: security
      job-name: trivy-image
      scan-mode: registry
      image: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      severity: HIGH,CRITICAL
      allow-failure: true
      tags:
        - cpu
  - component: $CI_SERVER_FQDN/devops_examples/components/security/trivy-image@v3.2.0
    inputs:
      stage: security
      job-name: trivy-odeformer-reference-image
      scan-mode: registry
      image: "$CI_REGISTRY_IMAGE/odeformer-reference:$CI_COMMIT_SHA"
      severity: HIGH,CRITICAL
      allow-failure: true
      tags:
        - cpu
  - component: $CI_SERVER_FQDN/devops_examples/components/security/trivy-image@v3.2.0
    inputs:
      stage: security
      job-name: trivy-odeformer-candidate-image
      scan-mode: registry
      image: "$CI_REGISTRY_IMAGE/odeformer-candidate:$CI_COMMIT_SHA"
      severity: HIGH,CRITICAL
      allow-failure: true
      tags:
        - cpu
  - component: $CI_SERVER_FQDN/devops_examples/components/python/dependency-vuln@v3.3.3
    inputs:
      stage: security
      job-name: python-dependency-vuln
      project-path: analysis
      python-version: "3.12"
      requirements-file: requirements.txt
      allow-failure: true
      tags:
        - cpu
  - component: $CI_SERVER_FQDN/devops_examples/components/security/bandit@v3.2.0
    inputs:
      stage: security
      job-name: python-sast
      scan-path: analysis
      python-version: "3.12"
      severity: medium
      confidence: medium
      allow-failure: true
      tags:
        - cpu

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - build
  - security

build_campaign_image:
  stage: build
  tags:
    - cpu
  timeout: 3 hours
  services:
    # Pinned by digest: the floating 29-dind tag switched attestations on in a patch release
    # (CHANGELOG, Fixed — 2026-09-22). This digest built 5a87efb successfully in pipeline #8379.
    - name: registry.scch.at/cache/library/docker:29-dind@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e
      alias: docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_TLS_CERTDIR: ""
    # BuildKit attaches a provenance attestation by default, which turns the push into an OCI
    # image index. The GitLab registry rejects that index with
    # "error from registry: blob unknown to registry" after every layer has already uploaded —
    # the layers arrive, the manifest does not, and the tag then fails to resolve with
    # "manifest unknown". Belt and braces: the variable covers the case where the build is
    # routed through buildx, the flags below state it explicitly.
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --provenance=false --sbom=false --pull --build-arg "EVOODE_GIT_SHA=$CI_COMMIT_SHA" -f containers/Dockerfile -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

build_odeformer_reference_image:
  stage: build
  tags:
    - cpu
  timeout: 3 hours
  services:
    # Pinned by digest: the floating 29-dind tag switched attestations on in a patch release
    # (CHANGELOG, Fixed — 2026-09-22). This digest built 5a87efb successfully in pipeline #8379.
    - name: registry.scch.at/cache/library/docker:29-dind@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e
      alias: docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - baselines/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_TLS_CERTDIR: ""
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --provenance=false --sbom=false --pull -f baselines/Dockerfile.odeformer-reference -t "$CI_REGISTRY_IMAGE/odeformer-reference:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/odeformer-reference:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE/odeformer-reference:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/odeformer-reference:$CI_COMMIT_REF_SLUG"

build_odeformer_candidate_image:
  stage: build
  tags:
    - cpu
  timeout: 3 hours
  services:
    # Pinned by digest: the floating 29-dind tag switched attestations on in a patch release
    # (CHANGELOG, Fixed — 2026-09-22). This digest built 5a87efb successfully in pipeline #8379.
    - name: registry.scch.at/cache/library/docker:29-dind@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e
      alias: docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - baselines/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_TLS_CERTDIR: ""
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --provenance=false --sbom=false --pull -f baselines/Dockerfile.odeformer-candidate -t "$CI_REGISTRY_IMAGE/odeformer-candidate:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/odeformer-candidate:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE/odeformer-candidate:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/odeformer-candidate:$CI_COMMIT_REF_SLUG"

trivy-fs:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - when: never

trivy-image:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  needs:
    - job: build_campaign_image
      artifacts: false

trivy-odeformer-reference-image:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - baselines/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  needs:
    - job: build_odeformer_reference_image
      artifacts: false

trivy-odeformer-candidate-image:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - baselines/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  needs:
    - job: build_odeformer_candidate_image
      artifacts: false

python-dependency-vuln:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - when: never

python-sast:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - when: never
