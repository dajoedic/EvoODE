# Phase-C C-6 full noisy-grid SINDy-family baselines with DOP853.
# Expected cost is approximately 200-250 core-hours for capacity planning only.
# 2026-10-14: 240 shards (~1 core-h each, shorter tail) and parallelism 24, approved by the user for this run
# only, as a temporary exception to the 40-core EvoODE limit; >= 16 cores stayed free on alnilam01/02.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-c6-sindy-baselines
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: c6-sindy-baselines
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-c6-sindy-baselines
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 240
  parallelism: 24
  backoffLimit: 50
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: c6-sindy-baselines
        hpc.scch.at/service: evoode-phase-c-c6-sindy-baselines
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: cell
          image: registry.gitlab.scch.at:443/joedicke/evoode/sindy-baselines:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          env:
            - name: EVO_SINDY_EXPORT_DIR
              value: /outputs/phase_c_c6_data_conditions_5dd1df839f8ece98f2bb3bbff78d15d8c433d9d3
            - name: EVO_SINDY_OUTPUT_DIR
              value: /outputs/c6_sindy_baselines_dop853_<COMMIT_SHA>
            - name: EVO_SINDY_N_SHARDS
              value: "240"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
