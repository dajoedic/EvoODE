# WP-N37 / B-03 bound oracle, exact dim-3/4 systems.
# Purpose: refit all 54 exact dim-3/4 C-1 cells from the filtered B-03 input
# for clamp bounds 10, 1000, and Inf. The input is produced by
# analysis/scripts/aggregate/prepare_phasec_b02_oracle_input.py --dims 3,4.
# No hard time cuts. Expected runtime:
# --estimate-cost (identical for bounds 10/1000/Inf): upper bound 76.6 core-h over 54 cells per
# bound, most expensive cell sys0055 seed42 ic2 <= 5.1 h, so <= ~15 h per shard (3 cells).
# B-02 finished far below its bound. Backlog: B-03; gate: B3.
# Image <COMMIT_SHA>: 5dd1df8 or later (the in-image scripts are unchanged since; WP-N37 adds manifests only).
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-c8-oracle-b03-bound10
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: c8-oracle-b03
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-c8-oracle-b03
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 18
  parallelism: 18
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: c8-oracle-b03
        hpc.scch.at/service: evoode-phase-c-c8-oracle-b03
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: shard
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              exec julia --project=/opt/EvoODE
              /opt/EvoODE/studies/regression/wp_n3_oracle_refit.jl
              --campaign paper1_phaseC_v1
              --input /outputs/phase_c_c8_oracle_b03_<COMMIT_SHA>/input/history.jsonl
              --output-dir /outputs/phase_c_c8_oracle_b03_<COMMIT_SHA>/bound_10
              --clamp-val 10
              --shards 18 --shard-index $((JOB_COMPLETION_INDEX + 1))
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
---
