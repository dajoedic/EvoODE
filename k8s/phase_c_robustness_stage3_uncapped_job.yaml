# WP-N37 / R-06 Stage 3 uncapped check, Orion System 41.
# Purpose: run the uncapped arm for System 41 under the same robustness
# conditions as Stage 3, using variant evogrow_v2_2_stage_local and condition
# uncapped. Apply this manifest only if
# studies/regression/print_phase_c_stage_caps.jl shows a finite noisy System 41
# cap below 5; without a finite cap the arm is identical by construction.
# Decision reference: DIARY.md, 2026-10-02.
# No hard time cuts. Expected runtime: about 8-17 h per
# cell if applied; Claude raises it with the user if a cell clearly exceeds 24 h.
# Backlog: R-06. Image <COMMIT_SHA>: 5dd1df8 or later (the in-image scripts are unchanged since; WP-N37 adds manifests only).
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-robustness-stage3-uncapped-bootstrap
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: robustness-stage3-uncapped-bootstrap
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-robustness-stage3-uncapped
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: robustness-stage3-uncapped-bootstrap
        hpc.scch.at/service: evoode-phase-c-robustness-stage3-uncapped
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: bootstrap
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |-
              set -eu
              BASE=/outputs/phase_c_robustness_stage3_uncapped_<COMMIT_SHA>
              TMP="$BASE/bootstrap"
              mkdir -p "$TMP"
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/generate_phase_c_manifest.jl \
                --output "$TMP/sigma_0p01_rho_0/manifest.csv" \
                --noise-sigma 0.01 --subsample-rho 0 --noise-realization 1 --clamp-val 10 --all-dimensions
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/generate_phase_c_manifest.jl \
                --output "$TMP/sigma_0p05_rho_0p5/manifest.csv" \
                --noise-sigma 0.05 --subsample-rho 0.5 --noise-realization 1 --clamp-val 10 --all-dimensions
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/select_phase_c_stage2_manifest.jl \
                --source "$TMP/sigma_0p01_rho_0/manifest.csv" \
                --source "$TMP/sigma_0p05_rho_0p5/manifest.csv" \
                --stage2-output "$BASE/manifest.csv" \
                --stage2-indices "$BASE/indices_stage3_uncapped.txt" \
                --smoke-output "$BASE/smoke_manifest.csv" \
                --smoke-indices "$BASE/indices_smoke.txt" \
                --stage2-systems 41 \
                --variant evogrow_v2_2_stage_local \
                --condition uncapped \
                --initial-condition-set 1 \
                --seed 42
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
            limits:
              cpu: "1"
              memory: 8Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
---
# WP-N37 / R-06 Stage 3 uncapped, System 41.
# Purpose: run exactly two uncapped robustness cells for System 41 under
# (sigma,rho)=(0.01,0) and (0.05,0.5). No smoke is needed for this arm.
# No deadline. Expected runtime: about 8-17 h per cell if applied.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-robustness-stage3-uncapped-orion
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: robustness-stage3-uncapped-orion
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-robustness-stage3-uncapped
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: robustness-stage3-uncapped-orion
        hpc.scch.at/service: evoode-phase-c-robustness-stage3-uncapped
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: cell
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - julia
            - --project=/opt/EvoODE
            - /opt/EvoODE/studies/regression/run_k8s_indexed_cell.jl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: EVO_BATCH_MANIFEST
              value: /outputs/phase_c_robustness_stage3_uncapped_<COMMIT_SHA>/manifest.csv
            - name: EVO_BATCH_INDEX_LIST
              value: /outputs/phase_c_robustness_stage3_uncapped_<COMMIT_SHA>/indices_stage3_uncapped.txt
            - name: EVO_BATCH_OUTPUT_DIR
              value: /outputs/phase_c_robustness_stage3_uncapped_<COMMIT_SHA>/tasks
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
