# Q5 grid, 1632 whole-cell shards on 16 pods (protocol amendment 2026-10-28).
# Probe-measured noise factor (dim1 x0.74, dim2 x8.0, dim3 x4.2; single cells 0.18-19)
# projects ~1,000-1,100 core-h (~EUR 1,500-1,650), ~63 h on 16 pods plus stragglers.
# Shards run in descending planned cost (q5_grid_paths.shards_cost_desc.txt, a pure
# reordering of q5_grid_paths.shards.txt). No deadline. Wall-clock is planning only.
# 4Gi matches Q4 for Julia JIT/solver headroom; observations are no larger.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-sideproject-q5
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: sideproject-q5
    hpc.scch.at/service: evoode-sideproject-q5
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 1632
  parallelism: 16
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/component: sideproject-q5
        hpc.scch.at/service: evoode-sideproject-q5
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: shard
          image: registry.gitlab.scch.at:443/joedicke/evoode:354106398d5e67ffa72c237e2ba83e3feeb25b31
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              exec julia --project=/opt/EvoODE
              /opt/EvoODE/studies/regression/sideproject_q5_noise_fits.jl
              --paths /outputs/sideproject_q5_354106398d5e67ffa72c237e2ba83e3feeb25b31/input/q5_grid_paths.json
              --export-dir /outputs/sideproject_q5_354106398d5e67ffa72c237e2ba83e3feeb25b31/input/export
              --unit-list /outputs/sideproject_q5_354106398d5e67ffa72c237e2ba83e3feeb25b31/input/q5_grid_paths.shards_cost_desc.txt
              --index "${JOB_COMPLETION_INDEX}"
              --output /outputs/sideproject_q5_354106398d5e67ffa72c237e2ba83e3feeb25b31/out/index_${JOB_COMPLETION_INDEX}.jsonl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
