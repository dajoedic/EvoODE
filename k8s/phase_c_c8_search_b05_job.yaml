# WP-N41 / C-8 Part B, remaining B-04 and B-05 EvoGrow searches.
# Purpose: run 10 clean-data Phase-C search cells, variant
# evogrow_v2_2_stage_capped, seed 42, sigma=0, rho=0:
# System 24 IC 1-2 at clamp_val=Inf; Systems 52 and 57 IC 1-2 at
# clamp_val=1000 and Inf. The smoke is System 1, IC 1, clamp_val=1000 and
# must match outputs/b04_search_bounds/bound_1000/tasks/cell_000001.jsonl
# in loss, support_terms, total_loss_evals, model_terms, and config_fingerprint.
# Operational note 2026-10-03: the job was started without this bootstrap
# because image 5dd1df8 did not know --stage2-cells; Claude generated the
# manifest locally and placed it on NFS. This bootstrap needs an image at or
# after the clamp_val numeric-matching fix.
# No hard time cuts. Expected runtime: bootstrap minutes, smoke < 5 min.
# C-1 needed 1.8 h and 1.0 h for System 52, and 17.2 h and 22.5 h for
# System 57. Without the parameter clamp the time per eval can rise by a
# multiple; B-03 shards exceeded 12 h, and System 57 cells can clearly exceed
# 24 h. Claude discusses this with the user before apply. Backlog: C-8/B-05.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-c8-search-b05-bootstrap
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: c8-search-b05-bootstrap
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-c8-search-b05
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: c8-search-b05-bootstrap
        hpc.scch.at/service: evoode-phase-c-c8-search-b05
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: bootstrap
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |-
              set -eu
              BASE=/outputs/phase_c_c8_search_b05_<COMMIT_SHA>
              TMP="$BASE/bootstrap"
              mkdir -p "$TMP"
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/generate_phase_c_manifest.jl \
                --output "$TMP/bound_1000/manifest.csv" \
                --noise-sigma 0 --subsample-rho 0 --noise-realization 0 --clamp-val 1000 --all-dimensions
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/generate_phase_c_manifest.jl \
                --output "$TMP/bound_Inf/manifest.csv" \
                --noise-sigma 0 --subsample-rho 0 --noise-realization 0 --clamp-val Inf --all-dimensions
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/select_phase_c_stage2_manifest.jl \
                --source "$TMP/bound_1000/manifest.csv" \
                --source "$TMP/bound_Inf/manifest.csv" \
                --stage2-output "$BASE/manifest.csv" \
                --stage2-indices "$BASE/indices_c8_search_b05.txt" \
                --smoke-output "$BASE/smoke_manifest.csv" \
                --smoke-indices "$BASE/indices_smoke.txt" \
                --stage2-cells 24:1:Inf,24:2:Inf,52:1:1000,52:2:1000,52:1:Inf,52:2:Inf,57:1:1000,57:2:1000,57:1:Inf,57:2:Inf \
                --smoke-system 1 \
                --initial-condition-set 1 \
                --seed 42
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
            limits:
              cpu: "1"
              memory: 8Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
---
# WP-N41 / C-8 Part B smoke.
# Purpose: run one System 1 clean-data search cell at clamp_val=1000, seed 42,
# IC set 1, to compare with the completed local B-04 cell.
# No deadline. Expected runtime: < 5 min.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-c8-search-b05-smoke
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: c8-search-b05-smoke
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-c8-search-b05
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: c8-search-b05-smoke
        hpc.scch.at/service: evoode-phase-c-c8-search-b05
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: cell
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - julia
            - --project=/opt/EvoODE
            - /opt/EvoODE/studies/regression/run_k8s_indexed_cell.jl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: EVO_BATCH_MANIFEST
              value: /outputs/phase_c_c8_search_b05_<COMMIT_SHA>/smoke_manifest.csv
            - name: EVO_BATCH_INDEX_LIST
              value: /outputs/phase_c_c8_search_b05_<COMMIT_SHA>/indices_smoke.txt
            - name: EVO_BATCH_OUTPUT_DIR
              value: /outputs/phase_c_c8_search_b05_<COMMIT_SHA>/smoke/tasks
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
