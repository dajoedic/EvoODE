# P-04 restart curve capacity planning, not evidence: expected ~100 core hours,
# upper bound 338 h, largest cell bound ~17 h. No activeDeadlineSeconds by project rule.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-c5-restart-curve
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: c5-restart-curve
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-c5-restart-curve
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  # 36 round-robin shards. The image <COMMIT_SHA> must carry
  # studies/regression/wp_n4_multistart_refit.jl with Phase-C mode.
  completions: 36
  parallelism: 30
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: c5-restart-curve
        hpc.scch.at/service: evoode-phase-c-c5-restart-curve
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: shard
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              exec julia --project=/opt/EvoODE
              /opt/EvoODE/studies/regression/wp_n4_multistart_refit.jl
              --campaign paper1_phaseC_v1
              --input /outputs/phase_c_c5_restart_curve_<COMMIT_SHA>/input/history.jsonl
              --output-dir /outputs/phase_c_c5_restart_curve_<COMMIT_SHA>/out
              --starts 10
              --shards 36 --shard-index $((JOB_COMPLETION_INDEX + 1))
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
