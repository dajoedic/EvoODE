apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-wp-t1e-bootstrap-index
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-wp-t1e
    app.kubernetes.io/component: index-bootstrap
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-wp-t1e-bootstrap
    hpc.scch.at/responsibility: joedicke
spec:
  # Start order matters: run this bootstrap first, then the smoke Job, then the
  # campaign Job. The smoke step is the cheap place where an expired
  # evoode-gitlab-pull deploy token shows up before the long run starts.
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-wp-t1e
        app.kubernetes.io/component: index-bootstrap
        hpc.scch.at/service: evoode-wp-t1e-bootstrap
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: bootstrap
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - julia
            - --project=/opt/EvoODE
            - /opt/EvoODE/studies/regression/wp_t1d_neighbourhood_loss.jl
          args:
            - --write-index-lists
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: EVO_T1D_OUTPUT_DIR
              value: /outputs/wp_t1e_<COMMIT_SHA>
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
