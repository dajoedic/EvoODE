apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-b-indexed-smoke
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-b
    app.kubernetes.io/component: indexed-cell-smoke
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-b-cells
    hpc.scch.at/responsibility: joedicke
spec:
  # Delete the Job and its pods one hour after completion. Without this a finished
  # Job leaves its pods behind forever, and the shared namespace fills up with them.
  # The results are the records on NFS, not the pod logs, so nothing is lost.
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 3
  parallelism: 3
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-b
        app.kubernetes.io/component: indexed-cell-smoke
        hpc.scch.at/service: evoode-phase-b-cells
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: cell
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - julia
            - --project=/opt/EvoODE
            - /opt/EvoODE/studies/regression/run_k8s_indexed_cell.jl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: EVO_BATCH_MANIFEST
              value: /outputs/wp_h4_smoke_<COMMIT_SHA>/manifest.csv
            - name: EVO_BATCH_INDEX_LIST
              value: /outputs/wp_h4_smoke_<COMMIT_SHA>/indices_dim1.txt
            - name: EVO_BATCH_OUTPUT_DIR
              value: /outputs/wp_h4_smoke_<COMMIT_SHA>/tasks
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
