            - --project=/opt/EvoODE
            - /opt/EvoODE/studies/regression/run_k8s_indexed_cell.jl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: EVO_BATCH_MANIFEST
              value: /outputs/phase_c_robustness_stage2_<COMMIT_SHA>/manifest.csv
            - name: EVO_BATCH_INDEX_LIST
              value: /outputs/phase_c_robustness_stage2_<COMMIT_SHA>/indices_stage2.txt
            - name: EVO_BATCH_OUTPUT_DIR
              value: /outputs/phase_c_robustness_stage2_<COMMIT_SHA>/tasks
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
