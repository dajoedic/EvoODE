# WP-N33c / R-05 Stage 2, Orion Systems 18 and 24.
# Purpose: build four Phase-C robustness rows on Orion, smoke the new WP-N32/WP-N33a
# path, then run Systems 18 and 24 for (sigma,rho)=(0.01,0) and (0.05,0.5),
# seed 42, IC set 1, realization 1, clamp_val=10. The stage2 run has 4 cells;
# the smoke has 1 cell and matches outputs/stage1/s0.01_r0/tasks/cell_000001.jsonl.
# No activeDeadlineSeconds (user, 2026-10-01: no hard time cuts). Expected runtime: bootstrap
# minutes, smoke < 5 min, the 4 cells hours each (system 24 exceeded 55 min on the laptop);
# Claude raises it with the user if a cell clearly exceeds ~24 h. Backlog: R-05.
# Image <COMMIT_SHA> must include WP-N32, WP-N33a, and WP-N35; commit eb630b5 or later.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-robustness-stage2-bootstrap
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: robustness-stage2-bootstrap
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-robustness-stage2
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: robustness-stage2-bootstrap
        hpc.scch.at/service: evoode-phase-c-robustness-stage2
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: bootstrap
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |-
              set -eu
              BASE=/outputs/phase_c_robustness_stage2_<COMMIT_SHA>
              TMP="$BASE/bootstrap"
              mkdir -p "$TMP"
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/generate_phase_c_manifest.jl \
                --output "$TMP/sigma_0p01_rho_0/manifest.csv" \
                --noise-sigma 0.01 --subsample-rho 0 --noise-realization 1 --clamp-val 10 --all-dimensions
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/generate_phase_c_manifest.jl \
                --output "$TMP/sigma_0p05_rho_0p5/manifest.csv" \
                --noise-sigma 0.05 --subsample-rho 0.5 --noise-realization 1 --clamp-val 10 --all-dimensions
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/select_phase_c_stage2_manifest.jl \
                --source "$TMP/sigma_0p01_rho_0/manifest.csv" \
                --source "$TMP/sigma_0p05_rho_0p5/manifest.csv" \
                --stage2-output "$BASE/manifest.csv" \
                --stage2-indices "$BASE/indices_stage2.txt" \
                --smoke-output "$BASE/smoke_manifest.csv" \
                --smoke-indices "$BASE/indices_smoke.txt" \
                --stage2-systems 18,24 \
                --smoke-system 1 \
                --initial-condition-set 1 \
                --seed 42
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
            limits:
              cpu: "1"
              memory: 8Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
---
# WP-N33c / R-05 Stage 2 smoke.
# Purpose: run one System 1 robustness cell at (sigma,rho)=(0.01,0), seed 42,
# IC set 1, realization 1, clamp_val=10, proving the image carries the new path.
# No deadline. Expected: one dim-1 smoke cell, < 5 min. Backlog: R-05.
# Image <COMMIT_SHA> must include WP-N32, WP-N33a, and WP-N35; commit eb630b5 or later.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-robustness-stage2-smoke
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: robustness-stage2-smoke
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-robustness-stage2
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: robustness-stage2-smoke
        hpc.scch.at/service: evoode-phase-c-robustness-stage2
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: cell
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - julia
            - --project=/opt/EvoODE
            - /opt/EvoODE/studies/regression/run_k8s_indexed_cell.jl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: EVO_BATCH_MANIFEST
              value: /outputs/phase_c_robustness_stage2_<COMMIT_SHA>/smoke_manifest.csv
            - name: EVO_BATCH_INDEX_LIST
              value: /outputs/phase_c_robustness_stage2_<COMMIT_SHA>/indices_smoke.txt
            - name: EVO_BATCH_OUTPUT_DIR
              value: /outputs/phase_c_robustness_stage2_<COMMIT_SHA>/smoke/tasks
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
---
