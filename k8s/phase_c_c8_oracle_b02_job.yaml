# WP-N33b / B-02 bound oracle, clamp_val=10.
# Purpose: refit all 126 exact dim-1/2 C-1 cells from the filtered B-02 input.
# This Job runs one of the three requested bounds; the full B-02 set is 378 refits.
# Deadline rationale: 18 shards keep the inherited C-5 upper-bound shard size below
# the 24 h Orion limit; Claude should confirm with --estimate-cost before apply.
# Backlog: B-02. Image <COMMIT_SHA> must include WP-N32 and WP-N33a; commit 49b0613 or later.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-c8-oracle-b02-bound10
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: c8-oracle-b02
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-c8-oracle-b02
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 18
  parallelism: 18
  activeDeadlineSeconds: 86400
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: c8-oracle-b02
        hpc.scch.at/service: evoode-phase-c-c8-oracle-b02
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: shard
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              exec julia --project=/opt/EvoODE
              /opt/EvoODE/studies/regression/wp_n3_oracle_refit.jl
              --campaign paper1_phaseC_v1
              --input /outputs/phase_c_c8_oracle_b02_<COMMIT_SHA>/input/history.jsonl
              --output-dir /outputs/phase_c_c8_oracle_b02_<COMMIT_SHA>/bound_10
              --clamp-val 10
              --shards 18 --shard-index $((JOB_COMPLETION_INDEX + 1))
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
---
