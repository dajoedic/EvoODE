apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-b-campaign
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-b
    app.kubernetes.io/component: indexed-campaign
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-b-cells
    hpc.scch.at/responsibility: joedicke
spec:
  # Delete the Job and its pods one hour after completion. Without this a finished
  # Job leaves its pods behind forever, and the shared namespace fills up with them.
  # The results are the records on NFS, not the pod logs, so nothing is lost.
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 756
  parallelism: 16
  # backoffLimit counts pod failures across the WHOLE Job, not per index. A scientific
  # failure does not fail the pod - run_batch_cell catches it, writes a record with a
  # non-null error field and exits 0. A failed pod therefore means infrastructure:
  # eviction, OOM kill, node drain, image pull. Over 756 cells and roughly nine days a
  # handful of those is normal, and with a low limit the entire campaign would stop.
  # 50 tolerates that while still failing the Job if something is systematically broken.
  backoffLimit: 50
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-b
        app.kubernetes.io/component: indexed-campaign
        hpc.scch.at/service: evoode-phase-b-cells
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: cell
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - julia
            - --project=/opt/EvoODE
            - /opt/EvoODE/studies/regression/run_k8s_indexed_cell.jl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: EVO_BATCH_MANIFEST
              value: /outputs/phase_b_campaign_<COMMIT_SHA>/manifest.csv
            - name: EVO_BATCH_INDEX_LIST
              value: /outputs/phase_b_campaign_<COMMIT_SHA>/indices_cost_desc.txt
            - name: EVO_BATCH_OUTPUT_DIR
              value: /outputs/phase_b_campaign_<COMMIT_SHA>/tasks
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
