# Q7: new states only; unchanged Q5 image, runner and resources.
# Inputs: q7_fit_paths.json + shard list in the Q7 input dir; data export reused read-only from the Q5 input dir (byte-identical). No deadline.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-sideproject-q7
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: sideproject-q7
    hpc.scch.at/service: evoode-sideproject-q7
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 338
  parallelism: 14
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/component: sideproject-q7
        hpc.scch.at/service: evoode-sideproject-q7
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: shard
          image: registry.gitlab.scch.at:443/joedicke/evoode:354106398d5e67ffa72c237e2ba83e3feeb25b31
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              exec julia --project=/opt/EvoODE
              /opt/EvoODE/studies/regression/sideproject_q5_noise_fits.jl
              --paths /outputs/sideproject_q7_354106398d5e67ffa72c237e2ba83e3feeb25b31/input/q7_fit_paths.json
              --export-dir /outputs/sideproject_q5_354106398d5e67ffa72c237e2ba83e3feeb25b31/input/export
              --unit-list /outputs/sideproject_q7_354106398d5e67ffa72c237e2ba83e3feeb25b31/input/q7_fit_paths.shards_cost_desc.txt
              --index "${JOB_COMPLETION_INDEX}"
              --output /outputs/sideproject_q7_354106398d5e67ffa72c237e2ba83e3feeb25b31/out/index_${JOB_COMPLETION_INDEX}.jsonl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
