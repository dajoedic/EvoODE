# WP-N42 / C-6 full robustness grid.
# Cost model from docs/paper1_phaseC_benchmark_plan.md Section 9.4c:
# 25.4k-35.1k core hours for the capped 3,366-cell dim-1/2 grid.
# Cells that exceed 24 h run without a hard cut; Claude reports outliers and
# the user decides case by case. Do not add activeDeadlineSeconds or timeouts.
# No cluster bootstrap: generate manifests locally and copy them to NFS first.
# Image 5dd1df8 is sufficient because no in-image script changes are required
# for execution once manifests exist on /outputs.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-c6-grid-capped
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: c6-grid-capped
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-c6-grid
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 3366
  parallelism: <PARALLELISM>
  backoffLimit: 50
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: c6-grid-capped
        hpc.scch.at/service: evoode-phase-c-c6-grid
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: cell
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - julia
            - --project=/opt/EvoODE
            - /opt/EvoODE/studies/regression/run_k8s_indexed_cell.jl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: EVO_BATCH_MANIFEST
              value: /outputs/phase_c_c6_grid_<COMMIT_SHA>/manifest.csv
            - name: EVO_BATCH_INDEX_LIST
              value: /outputs/phase_c_c6_grid_<COMMIT_SHA>/indices_cost_desc.txt
            - name: EVO_BATCH_OUTPUT_DIR
              value: /outputs/phase_c_c6_grid_<COMMIT_SHA>/tasks
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
---
# WP-N42 / C-6 uncapped comparison arm.
