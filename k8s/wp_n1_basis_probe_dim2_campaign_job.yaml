apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-wp-n1-dim2-campaign
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-wp-n1-basis-probe
    app.kubernetes.io/component: indexed-campaign
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-b-cells
    hpc.scch.at/responsibility: joedicke
spec:
  # Delete the Job and its pods one hour after completion. The results are the
  # records on NFS, not the pod logs.
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 336
  # Raised from the agreed 16 (docs/hpc_requirements.md: "raise on request") after checking the
  # namespace on 2026-09-09: no ResourceQuota, no LimitRange, no cluster quota — the 16 are an
  # agreement, not an enforced cap. CPU was idle at 171m across all 12 resident pods of 96 cores.
  # This is safe for the co-tenants because requests == limits below: the scheduler queues surplus
  # pods as Pending rather than evicting anyone, and a pod exceeding 2Gi kills itself, not
  # OpenSearch. Above 32 there is nothing to gain — the longest single dim-2 cell of the campaign
  # ran 46.98 h, and a cell cannot be split, so wall clock floors at ~47 h regardless.
  parallelism: 32
  # backoffLimit counts pod failures across the whole Job. Scientific failures
  # are recorded by run_batch_cell; pod failures are treated as infrastructure.
  backoffLimit: 50
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-wp-n1-basis-probe
        app.kubernetes.io/component: indexed-campaign
        hpc.scch.at/service: evoode-phase-b-cells
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: cell
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - julia
            - --project=/opt/EvoODE
            - /opt/EvoODE/studies/regression/run_k8s_indexed_cell.jl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: EVO_BATCH_MANIFEST
              value: /outputs/wp_n1_dim2_probe_<COMMIT_SHA>/manifest.csv
            - name: EVO_BATCH_INDEX_LIST
              value: /outputs/wp_n1_dim2_probe_<COMMIT_SHA>/indices_dim2.txt
            - name: EVO_BATCH_OUTPUT_DIR
              value: /outputs/wp_n1_dim2_probe_<COMMIT_SHA>/tasks
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
