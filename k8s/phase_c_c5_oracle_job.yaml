apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-c5-oracle
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: c5-oracle
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-c5-oracle
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  # C-5 oracle refit (WP-N3 on Phase C): the true structure of every exact C-1 cell
  # (180 cells) is refit with the C-1 optimizer, clamp_val = 10 included. The image
  # <COMMIT_SHA> must carry the WP-N25 scripts; 1db1193 does, and its src/ and
  # run_regression.jl are identical to the campaign image 221a3a7.
  # 36 round-robin shards. The --estimate-cost upper bound on the C-1 history is
  # 101 core-hours in total and at most 5.9 h per shard (every fit exhausting its
  # loss-evaluation budget); the deadline is a generous 48 h bound, not an estimate.
  completions: 36
  parallelism: 30
  activeDeadlineSeconds: 172800
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: c5-oracle
        hpc.scch.at/service: evoode-phase-c-c5-oracle
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: shard
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              exec julia --project=/opt/EvoODE
              /opt/EvoODE/studies/regression/wp_n3_oracle_refit.jl
              --campaign paper1_phaseC_v1
              --input /outputs/phase_c_c5_oracle_<COMMIT_SHA>/input/history.jsonl
              --output-dir /outputs/phase_c_c5_oracle_<COMMIT_SHA>/out
              --shards 36 --shard-index $((JOB_COMPLETION_INDEX + 1))
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
