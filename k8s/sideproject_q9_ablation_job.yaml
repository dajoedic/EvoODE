# Q9-ABL (protocol docs/sideproject_residual_growth_protocol_q9_ablation.md): five Figure-6 arms on the noisy dim-1/2 Q9 data sets; one shard per data set with all five arms, descending planned cost; parallelism = 40 minus other EvoODE pods; no deadline.
# Image and NFS input directory carry the commit <COMMIT_SHA> that added the Q9-ABL runner and protocol.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-sideproject-q9abl
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: sideproject-q9abl
    hpc.scch.at/service: evoode-sideproject-q9abl
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 3060
  parallelism: <PARALLELISM>
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/component: sideproject-q9abl
        hpc.scch.at/service: evoode-sideproject-q9abl
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: shard
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              exec julia --project=/opt/EvoODE
              /opt/EvoODE/studies/regression/sideproject_q9_ablation_fits.jl
              --paths /outputs/sideproject_q9abl_<COMMIT_SHA>/input/q9abl_paths.json
              --export-dir /outputs/phase_c_c6_data_conditions_5dd1df839f8ece98f2bb3bbff78d15d8c433d9d3
              --unit-list /outputs/sideproject_q9abl_<COMMIT_SHA>/input/q9abl_grid.shards_cost_desc.txt
              --index "${JOB_COMPLETION_INDEX}"
              --output /outputs/sideproject_q9abl_<COMMIT_SHA>/out/index_${JOB_COMPLETION_INDEX}.jsonl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
            # The image has no docs/; the runner checks the frozen Q9-ABL protocol hash at this path.
            - name: evoode-bigdata
              mountPath: /opt/EvoODE/docs
              subPath: data-science/joedicke/sideproject_q9abl_<COMMIT_SHA>/input/docs
              readOnly: true
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
