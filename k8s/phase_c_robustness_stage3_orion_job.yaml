# WP-N37 / R-06 Stage 3, Orion System 41.
# Purpose: run two Phase-C robustness cells for System 41, variant
# evogrow_v2_2_stage_capped, seed 42, IC set 1, realization 1, clamp_val=10:
# (sigma,rho)=(0.01,0) and (0.05,0.5), plus a System 1 smoke.
# No hard time cuts. Expected runtime: bootstrap minutes,
# smoke < 5 min, about 8-17 h per System 41 cell. The C-1 cell for System 41
# ran 24/30 levels, 6.53 M loss evals, 11.3 h; Stage 2 noise factors were
# 0.7-1.0 where C-1 already ran many levels and 13.7 where C-1 stopped after
# 2 levels. Claude raises it with the user if a cell clearly exceeds 24 h.
# Backlog: R-06. Image <COMMIT_SHA>: 5dd1df8 or later (the in-image scripts are unchanged since; WP-N37 adds manifests only).
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-robustness-stage3-bootstrap
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: robustness-stage3-bootstrap
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-robustness-stage3
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: robustness-stage3-bootstrap
        hpc.scch.at/service: evoode-phase-c-robustness-stage3
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: bootstrap
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |-
              set -eu
              BASE=/outputs/phase_c_robustness_stage3_<COMMIT_SHA>
              TMP="$BASE/bootstrap"
              mkdir -p "$TMP"
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/generate_phase_c_manifest.jl \
                --output "$TMP/sigma_0p01_rho_0/manifest.csv" \
                --noise-sigma 0.01 --subsample-rho 0 --noise-realization 1 --clamp-val 10 --all-dimensions
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/generate_phase_c_manifest.jl \
                --output "$TMP/sigma_0p05_rho_0p5/manifest.csv" \
                --noise-sigma 0.05 --subsample-rho 0.5 --noise-realization 1 --clamp-val 10 --all-dimensions
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/select_phase_c_stage2_manifest.jl \
                --source "$TMP/sigma_0p01_rho_0/manifest.csv" \
                --source "$TMP/sigma_0p05_rho_0p5/manifest.csv" \
                --stage2-output "$BASE/manifest.csv" \
                --stage2-indices "$BASE/indices_stage3.txt" \
                --smoke-output "$BASE/smoke_manifest.csv" \
                --smoke-indices "$BASE/indices_smoke.txt" \
                --stage2-systems 41 \
                --smoke-system 1 \
                --initial-condition-set 1 \
                --seed 42
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
            limits:
              cpu: "1"
              memory: 8Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
---
# WP-N37 / R-06 Stage 3 smoke.
# Purpose: run one System 1 robustness cell at (sigma,rho)=(0.01,0), seed 42,
# IC set 1, realization 1, clamp_val=10, proving the image carries the path.
# No deadline. Expected runtime: < 5 min. Backlog: R-06.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-robustness-stage3-smoke
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: robustness-stage3-smoke
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-robustness-stage3
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: robustness-stage3-smoke
        hpc.scch.at/service: evoode-phase-c-robustness-stage3
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: cell
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - julia
            - --project=/opt/EvoODE
            - /opt/EvoODE/studies/regression/run_k8s_indexed_cell.jl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: EVO_BATCH_MANIFEST
              value: /outputs/phase_c_robustness_stage3_<COMMIT_SHA>/smoke_manifest.csv
            - name: EVO_BATCH_INDEX_LIST
              value: /outputs/phase_c_robustness_stage3_<COMMIT_SHA>/indices_smoke.txt
            - name: EVO_BATCH_OUTPUT_DIR
              value: /outputs/phase_c_robustness_stage3_<COMMIT_SHA>/smoke/tasks
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
