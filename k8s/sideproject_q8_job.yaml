# Q8: rebuilt image required. Unpack q8_export_additions.tar into input/export_additions.
# One shard is one (cell, arm); parallelism 16; no deadline.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-sideproject-q8
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: sideproject-q8
    hpc.scch.at/service: evoode-sideproject-q8
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 3540
  parallelism: 16
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/component: sideproject-q8
        hpc.scch.at/service: evoode-sideproject-q8
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: shard
          image: registry.gitlab.scch.at:443/joedicke/evoode:512dd5bd534530327b1f5fed3e7892a1e0950016
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              exec julia --project=/opt/EvoODE
              /opt/EvoODE/studies/regression/sideproject_q8_fits.jl
              --paths /outputs/sideproject_q8_512dd5bd534530327b1f5fed3e7892a1e0950016/input/q8_fit_paths.json
              --export-dir /outputs/sideproject_q8_512dd5bd534530327b1f5fed3e7892a1e0950016/input/export_additions
              --fallback-export-dir /outputs/sideproject_q5_354106398d5e67ffa72c237e2ba83e3feeb25b31/input/export
              --unit-list /outputs/sideproject_q8_512dd5bd534530327b1f5fed3e7892a1e0950016/input/q8_grid.shards_cost_desc.txt
              --index "${JOB_COMPLETION_INDEX}"
              --output /outputs/sideproject_q8_512dd5bd534530327b1f5fed3e7892a1e0950016/out/index_${JOB_COMPLETION_INDEX}.jsonl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
            # The image has no docs/; the runner checks the frozen Q8 protocol's hash at this path.
            - name: evoode-bigdata
              mountPath: /opt/EvoODE/docs
              subPath: data-science/joedicke/sideproject_q8_512dd5bd534530327b1f5fed3e7892a1e0950016/input/docs
              readOnly: true
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
