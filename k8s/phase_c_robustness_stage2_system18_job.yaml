# (sigma,rho)=(0.01,0) and (0.05,0.5).
# Deadline rationale: 2 dim-1 cells, bounded by Orion's requested 24 h limit. Backlog: R-05.
# Image <COMMIT_SHA> must include WP-N32 and WP-N33a; commit 49b0613 or later.
