# WP-N33b / R-05 Stage 2, System 18.
# Purpose: build two Phase-C robustness rows on Orion, smoke the new WP-N32/WP-N33a path,
# then run System 18 for (sigma,rho)=(0.01,0) and (0.05,0.5), seed 42, IC set 1,
# realization 1, clamp_val=10. The stage2 run has 2 cells; the smoke has 1 cell.
# Deadline rationale: bootstrap is capped at 1 h, smoke at 1 h, and the 2-cell dim-1
# run is capped at the Orion maximum allowed here, 24 h. Backlog: R-05.
# Image <COMMIT_SHA> must include WP-N32 and WP-N33a; commit 49b0613 or later.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-robustness-stage2-bootstrap
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: robustness-stage2-bootstrap
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-robustness-stage2
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: robustness-stage2-bootstrap
        hpc.scch.at/service: evoode-phase-c-robustness-stage2
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: bootstrap
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |-
              set -eu
              BASE=/outputs/phase_c_robustness_stage2_<COMMIT_SHA>
              TMP="$BASE/bootstrap"
              mkdir -p "$TMP"
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/generate_phase_c_manifest.jl \
                --output "$TMP/sigma_0p01_rho_0/manifest.csv" \
                --noise-sigma 0.01 --subsample-rho 0 --noise-realization 1 --clamp-val 10 --all-dimensions
              julia --project=/opt/EvoODE /opt/EvoODE/studies/regression/generate_phase_c_manifest.jl \
                --output "$TMP/sigma_0p05_rho_0p5/manifest.csv" \
                --noise-sigma 0.05 --subsample-rho 0.5 --noise-realization 1 --clamp-val 10 --all-dimensions
              BASE="$BASE" python - <<'PY'
              import csv
              import os
              from pathlib import Path

              base = Path(os.environ["BASE"])
              sources = [
                  base / "bootstrap" / "sigma_0p01_rho_0" / "manifest.csv",
                  base / "bootstrap" / "sigma_0p05_rho_0p5" / "manifest.csv",
              ]

              def select(path, *, system_id):
                  with path.open(newline="", encoding="utf-8") as handle:
                      rows = list(csv.DictReader(handle))
                  matches = [
                      row for row in rows
                      if row["system_id"] == str(system_id)
                      and row["variant"] == "evogrow_v2_2_stage_capped"
                      and row["condition"] == "capped"
                      and row["initial_condition_set"] == "1"
                      and row["seed"] == "42"
                  ]
                  if len(matches) != 1:
                      raise SystemExit(f"{path}: expected one match for system {system_id}, got {len(matches)}")
                  return matches[0]

              stage2_rows = [select(path, system_id=18) for path in sources]
              smoke_row = select(sources[0], system_id=1)
              fieldnames = list(stage2_rows[0].keys())
              for idx, row in enumerate(stage2_rows, start=1):
                  row["index"] = str(idx)
              smoke_row["index"] = "1"

              with (base / "manifest.csv").open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(stage2_rows)
              with (base / "indices_stage2.txt").open("w", encoding="utf-8") as handle:
                  handle.write("1\n2\n")
              with (base / "smoke_manifest.csv").open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerow(smoke_row)
              with (base / "indices_smoke.txt").open("w", encoding="utf-8") as handle:
                  handle.write("1\n")
              print(f"stage2_manifest={base / 'manifest.csv'}")
              print("stage2_rows=2")
              print(f"smoke_manifest={base / 'smoke_manifest.csv'}")
              print("smoke_rows=1")
              PY
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
            limits:
              cpu: "1"
              memory: 8Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
---
# WP-N33b / R-05 Stage 2 smoke.
# Purpose: run one System 1 robustness cell at (sigma,rho)=(0.01,0), seed 42,
# IC set 1, realization 1, clamp_val=10, proving the image carries the new path.
# Deadline rationale: one dim-1 smoke cell is capped at 1 h. Backlog: R-05.
# Image <COMMIT_SHA> must include WP-N32 and WP-N33a; commit 49b0613 or later.
apiVersion: batch/v1
kind: Job
metadata:
  name: evoode-phase-c-robustness-stage2-smoke
  namespace: scch-das
  labels:
    app.kubernetes.io/name: evoode
    app.kubernetes.io/part-of: evoode-phase-c
    app.kubernetes.io/component: robustness-stage2-smoke
    app.kubernetes.io/managed-by: kubectl
    hpc.scch.at/service: evoode-phase-c-robustness-stage2
    hpc.scch.at/responsibility: joedicke
spec:
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed
  completions: 1
  parallelism: 1
  activeDeadlineSeconds: 3600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evoode
        app.kubernetes.io/part-of: evoode-phase-c
        app.kubernetes.io/component: robustness-stage2-smoke
        hpc.scch.at/service: evoode-phase-c-robustness-stage2
        hpc.scch.at/responsibility: joedicke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: evoode-gitlab-pull
      containers:
        - name: cell
          image: registry.gitlab.scch.at:443/joedicke/evoode:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          command:
            - julia
            - --project=/opt/EvoODE
            - /opt/EvoODE/studies/regression/run_k8s_indexed_cell.jl
          env:
            - name: JULIA_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: EVO_BATCH_MANIFEST
              value: /outputs/phase_c_robustness_stage2_<COMMIT_SHA>/smoke_manifest.csv
            - name: EVO_BATCH_INDEX_LIST
              value: /outputs/phase_c_robustness_stage2_<COMMIT_SHA>/indices_smoke.txt
            - name: EVO_BATCH_OUTPUT_DIR
              value: /outputs/phase_c_robustness_stage2_<COMMIT_SHA>/smoke/tasks
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: evoode-bigdata
              mountPath: /outputs
              subPath: data-science/joedicke
      volumes:
        - name: evoode-bigdata
          nfs:
            server: nfs.orion.scch.at
            path: /bigdata
---
